name: README previews

# Renders the theme's optional stylesheets and colour themes with fxcss and
# publishes the captures to a `previews` branch, so the README can embed
# stable raw URLs that refresh themselves whenever the theme changes on
# master. Same branch-publishing pattern as ci-previews; images are for
# looking at — the pass/fail check remains pr-preview.yml.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'chrome/**'
      - 'custom/**'
      - '.github/workflows/readme-previews.yml'

permissions:
  contents: write

concurrency:
  group: readme-previews
  cancel-in-progress: true

env:
  FXCSS_VERSION: 0.15.0

jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fxcss
        run: >-
          python -m pip install --disable-pip-version-check
          "fxcss[images]==${{ env.FXCSS_VERSION }}"

      - name: Install Firefox
        run: |
          set -euo pipefail
          curl -sSL -o firefox.dmg \
            "https://download.mozilla.org/?product=firefox-latest-ssl&os=osx&lang=en-US"
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/ffprev firefox.dmg
          cp -R /Volumes/ffprev/Firefox.app "$RUNNER_TEMP/Firefox.app"
          hdiutil detach /Volumes/ffprev -quiet
          echo "FIREFOX_BIN=$RUNNER_TEMP/Firefox.app/Contents/MacOS/firefox" >> "$GITHUB_ENV"

      - name: Render
        run: fxcss shot --theme . --out shots --variants all

      - name: Publish to previews branch
        run: |
          set -euo pipefail
          # `shot` writes its captures FLAT into --out. (The full/ subdirectory
          # in the PR-preview artifacts is made by `compare`, from the head
          # screenshots it normalises -- a different command, different layout.)
          count=$(find shots -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::no captures in shots/ -- fxcss shot wrote nothing"
            exit 1
          fi
          echo "publishing ${count} captures"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Always a fresh orphan, force-pushed: this branch is a snapshot of
          # the current theme, never a history. Keeping history here would add
          # ~1MB of PNG blobs to the repo on every theme change, forever.
          git checkout --orphan previews
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 \
            ! -name .git ! -name shots -exec rm -rf {} +
          printf '%s\n' \
            '# README preview images' '' \
            'Rendered by the README previews workflow, from the theme as it is' \
            'on master. Safe to delete; regenerated on the next theme change.' \
            '' \
            'This branch carries no history by design -- each run replaces it.' > README.md
          cp shots/*.png .
          rm -rf shots
          git add -A
          git commit -q -m "previews: ${GITHUB_SHA}"
          git push --force origin previews
