name: README previews

# Renders the theme's optional stylesheets and colour themes with fxcss and
# publishes the captures to a `previews` branch, so the README can embed
# stable raw URLs that refresh themselves whenever the theme changes on
# master. Same branch-publishing pattern as ci-previews; images are for
# looking at — the pass/fail check remains pr-preview.yml.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'chrome/**'
      - 'custom/**'
      - '.github/workflows/readme-previews.yml'

permissions:
  contents: write

concurrency:
  group: readme-previews
  cancel-in-progress: true

env:
  FXCSS_VERSION: 0.13.0

jobs:
  render:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fxcss
        run: >-
          python -m pip install --disable-pip-version-check
          "fxcss[images]==${{ env.FXCSS_VERSION }}"

      - name: Install Firefox
        run: |
          set -euo pipefail
          curl -sSL -o firefox.dmg \
            "https://download.mozilla.org/?product=firefox-latest-ssl&os=osx&lang=en-US"
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/ffprev firefox.dmg
          cp -R /Volumes/ffprev/Firefox.app "$RUNNER_TEMP/Firefox.app"
          hdiutil detach /Volumes/ffprev -quiet
          echo "FIREFOX_BIN=$RUNNER_TEMP/Firefox.app/Contents/MacOS/firefox" >> "$GITHUB_ENV"

      - name: Render
        run: fxcss shot --theme . --out shots --variants all

      - name: Publish to previews branch
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin previews --depth=1 || true
          if git rev-parse --verify origin/previews >/dev/null 2>&1; then
            git checkout -B previews origin/previews
          else
            git checkout --orphan previews
            git rm -rf --cached . >/dev/null 2>&1 || true
            find . -maxdepth 1 -mindepth 1 \
              ! -name .git ! -name shots -exec rm -rf {} +
            printf '%s\n' \
              '# README preview images' '' \
              'Rendered by the README previews workflow. Safe to delete;' \
              'regenerated on the next theme change on master.' > README.md
          fi
          rm -f ./*.png
          cp shots/full/*.png .
          git add -A ':!shots' README.md 2>/dev/null || git add -A ':!shots'
          if git diff --cached --quiet; then
            echo "previews unchanged"
          else
            git commit -m "previews: ${GITHUB_SHA}"
            git push origin previews
          fi
