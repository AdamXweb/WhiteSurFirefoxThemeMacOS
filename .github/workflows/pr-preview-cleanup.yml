name: PR preview cleanup

# Deletes a pull request's preview images once it closes, so the ci-previews
# branch only ever holds screenshots for open pull requests.
#
# pull_request_target runs from the base branch and this job never checks out
# or executes pull request code -- it only removes a directory keyed by the
# pull request number.

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Remove preview images for this pull request
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$PR" in
            ''|*[!0-9]*) echo "unexpected PR number: $PR"; exit 1 ;;
          esac
          if ! git ls-remote --exit-code --heads origin ci-previews >/dev/null 2>&1; then
            echo "no ci-previews branch; nothing to clean"; exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin ci-previews --depth=1
          git checkout -B ci-previews origin/ci-previews
          if [ ! -d "pr-${PR}" ]; then
            echo "no previews stored for PR #${PR}"; exit 0
          fi
          git rm -r --quiet "pr-${PR}"
          git commit -m "preview: clean up PR #${PR}"
          git push origin ci-previews
